<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect-me</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Mono', 'Fira Code', 'Monaco', 'Menlo', 'Cascadia Code', 'Consolas', monospace;
        }
       html{
           zoom:0.8;
       }
        body {
            background: #080c14;
            background-image: radial-gradient(circle at 40% 30%, #192337 0%, #040811 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* main container */
        .raise-panel {
            width: min(1020px, 100%);
            background: #0b1221;
            border: 2px solid #2b3e5c;
            border-radius: 28px 28px 26px 26px;
            box-shadow: 0 25px 45px #000000cc, 0 0 0 2px #1c2e4a inset, 0 0 0 4px #00000040 inset;
            overflow: hidden;
            backdrop-filter: blur(1px);
        }

        /* header */
        .raise-header {
            background: linear-gradient(150deg, #141f34, #0a1322);
            padding: 1rem 2.2rem;
            border-bottom: 3px solid #1f3d62;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #d1e6ff;
            text-shadow: 0 0 8px #3a8aff;
            font-weight: 550;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            border-radius: 26px 26px 0 0;
        }

        .header-left {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .header-left span:first-child {
            background: #1b2b48;
            padding: 6px 20px;
            border-radius: 40px;
            border: 1px solid #4072b0;
            color: #c6ecff;
            font-size: 1rem;
            box-shadow: 0 0 14px #1f6ea5;
            font-weight: 500;
        }

        .command-badge {
            background: #18263f;
            padding: 4px 16px;
            border-radius: 30px;
            color: #a6c9ff;
            border: 1px solid #3a6191;
            font-size: 0.9rem;
        }

        .header-right {
            display: flex;
            gap: 20px;
            color: #a6c9ff;
        }

        .header-right i {
            font-style: normal;
            background: #132238;
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid #346399;
        }

        /* main log area */
        .log-window {
            height: 480px;
            overflow-y: auto;
            padding: 1.6rem 2.2rem;
            background: #080f1c;
            background-image: linear-gradient(0deg, #0c1425 0%, #070e1a 100%);
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-bottom: 1px solid #1a2c48;
            border-top: 1px solid #01050c;
        }

        /* message cards - left (incoming) / right (outgoing) */
        .message-card {
            max-width: 80%;
            padding: 12px 24px 14px 24px;
            border-radius: 20px 20px 20px 6px;
            font-size: 0.98rem;
            line-height: 1.5;
            word-wrap: break-word;
            box-shadow: 0 4px 10px #000000b3, 0 0 0 1px #3f5d8a inset;
            backdrop-filter: blur(2px);
            transition: 0.08s linear;
            border: 1px solid #3c5475;
        }

        .message-card.incoming {
            align-self: flex-start;
            background: #121e32;
            border-left: 6px solid #2a88b0;
            color: #d9efff;
            border-bottom-left-radius: 6px;
            text-shadow: 0 1px 2px black;
        }

        .message-card.outgoing {
            align-self: flex-end;
            background: #1f2b42;
            border-right: 6px solid #b59f40;
            color: #fff4e0;
            border-bottom-right-radius: 6px;
            text-align: right;
            box-shadow: 0 4px 14px #000000, 0 0 0 1px #8f853b inset;
        }

        /* header inside card */
        .msg-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            font-size: 0.78rem;
            margin-bottom: 6px;
            letter-spacing: 0.4px;
            flex-wrap: wrap;
        }

        .incoming .msg-header {
            color: #7aceff;
        }

        .outgoing .msg-header {
            color: #ffdb9d;
            flex-direction: row-reverse;
        }

        .sender {
            font-weight: 800;
            background: #00000055;
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid currentColor;
            font-size: 0.76rem;
            text-transform: lowercase;
        }

        .time {
            opacity: 0.7;
            font-size: 0.71rem;
        }

        .private-badge {
            background: #392b55;
            color: #dbb9ff;
            font-size: 0.68rem;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #ac7eff;
            font-weight: 700;
        }

        .msg-body {
            font-weight: 400;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* system notices */
        .system-line {
            align-self: center;
            background: #1b253ce6;
            border: 1px dashed #4a70a5;
            border-radius: 40px;
            padding: 7px 26px;
            color: #c2dcff;
            font-size: 0.88rem;
            width: fit-content;
            max-width: 92%;
            text-align: center;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 14px #1b4a7a;
            margin: 6px 0;
        }

        /* bottom input area */
        .input-area {
            background: #0b1322;
            padding: 1rem 2.2rem;
            display: flex;
            gap: 1.2rem;
            align-items: center;
            border-top: 2px solid #1d3454;
            flex-wrap: wrap;
        }

        .input-area input {
            flex: 2 1 280px;
            background: #0a1120;
            border: 2px solid #274763;
            border-radius: 60px;
            padding: 14px 26px;
            font-size: 1rem;
            color: #d6f0ff;
            outline: none;
            box-shadow: 0 0 0 1px #1c314f inset, inset 0 0 10px #000;
            transition: 0.15s;
        }

        .input-area input:focus {
            border-color: #1f9fc7;
            box-shadow: 0 0 15px #1fb0d0, inset 0 0 8px #07121e;
        }

        .input-area input::placeholder {
            color: #3f628a;
            font-weight: 400;
        }

        .input-area button {
            background: #1b2e4a;
            border: 2px solid #3d74aa;
            color: #ecf7ff;
            padding: 12px 34px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 1.2px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 5px 0 #0f1a2b, 0 0 12px #3b86b4;
            text-transform: uppercase;
        }

        .input-area button:hover {
            background: #27557a;
            border-color: #4fc9ff;
            box-shadow: 0 0 18px #27c3ff;
        }

        .input-area button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f1a2b;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            color: #3f98b0;
            font-size: 0.85rem;
            border-left: 2px solid #26436a;
            padding-left: 24px;
        }

        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #16b0a0;
            box-shadow: 0 0 12px #0ff;
            animation: pulse 1.8s infinite;
        }

        .led.off {
            background: #822;
            box-shadow: 0 0 10px #f33;
            animation: none;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); box-shadow: 0 0 20px #0ff; }
            100% { opacity: 1; transform: scale(1); }
        }

        .log-window::-webkit-scrollbar {
            width: 8px;
        }

        .log-window::-webkit-scrollbar-track {
            background: #0b1428;
        }

        .log-window::-webkit-scrollbar-thumb {
            background: #34638f;
            border-radius: 10px;
            border: 1px solid #1a334a;
        }
        @keyframes blink {
  0% {opacity:1;}
  50% {opacity:0;}
  100% {opacity:1;}
        }
    </style>
</head>

    <div class="raise-panel">
        <!-- header with clean title -->
        <div class="raise-header">
            <div class="header-left">
                <span>⏁ connect-me</span>
              <!--  <span class="command-badge">/name</span>
                <span class="command-badge">/pm</span>-->
            </div>
            <div class="header-right">
                <i id="connection-status">connecting</i>
                <i id="user-name">⍰ anonymous</i>
            </div>
        </div>

        <!-- main log area -->
        <div class="log-window" id="log-window">
            <div class="system-line"><span style="color:red; font-weight:bold;">
  
  <span style="
    display:inline-block;
    width:10px;
    height:10px;
    background:red;
    border-radius:50%;
    margin-right:6px;
    animation:blink 1s infinite;
  "></span>

  <sup> Try Commands </sup>➤ raise · log · use <strong>/name handle</strong> to join · <strong>/pm user message</strong> for direct and without command for group message</div>
            <div class="system-line">⌨️ messages from others appear on left · yours on right</div>
        </div>

        <!-- input line -->
        <div class="input-area">
            <input type="text" id="message-input" placeholder=">_ raise /message or command ..." autocomplete="off">
            <button id="send-button">⏎ send</button>
            <div class="live-indicator">
                <span class="led" id="led-indicator"></span>
                <span id="live-text">offline</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const logWindow = document.getElementById('log-window');
            const inputField = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            const ledIndicator = document.getElementById('led-indicator');
            const liveText = document.getElementById('live-text');
            const connectionStatus = document.getElementById('connection-status');
            const userNameSpan = document.getElementById('user-name');

            let socket = null;
            let currentUser = null;
            const wsUrl = 'wss://connect-me-vclx.onrender.com/chat';

            // add message card (left = incoming, right = outgoing)
            function addCard(content, sender, type = 'standard', isOutgoing = false, isPrivate = false) {
                if (!content || content.trim() === '') return;

                const card = document.createElement('div');
                card.classList.add('message-card');
                if (isOutgoing) {
                    card.classList.add('outgoing');
                } else {
                    card.classList.add('incoming');
                }

                const header = document.createElement('div');
                header.classList.add('msg-header');

                const senderSpan = document.createElement('span');
                senderSpan.classList.add('sender');
                senderSpan.textContent = (sender === 'system' || sender === 'SERVER') ? '⚙️ core' : (sender.length > 22 ? sender.slice(0, 20)+'…' : sender);

                const timeSpan = document.createElement('span');
                timeSpan.classList.add('time');
                const now = new Date();
                timeSpan.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                header.appendChild(senderSpan);
                header.appendChild(timeSpan);

                if (isPrivate && !isOutgoing) {
                    const priv = document.createElement('span');
                    priv.classList.add('private-badge');
                    priv.textContent = '🔒 direct';
                    header.appendChild(priv);
                } else if (isPrivate && isOutgoing) {
                    const priv = document.createElement('span');
                    priv.classList.add('private-badge');
                    priv.textContent = '🔒 to';
                    header.appendChild(priv);
                }

                const body = document.createElement('div');
                body.classList.add('msg-body');
                body.textContent = content;

                card.appendChild(header);
                card.appendChild(body);
                logWindow.appendChild(card);
                logWindow.scrollTop = logWindow.scrollHeight;
            }

            function addSystemLine(text) {
                const line = document.createElement('div');
                line.className = 'system-line';
                line.textContent = text;
                logWindow.appendChild(line);
                logWindow.scrollTop = logWindow.scrollHeight;
            }

            function setOnline(online) {
                if (online) {
                    ledIndicator.classList.remove('off');
                    connectionStatus.textContent = '🟢 live';
                    liveText.textContent = 'connected';
                } else {
                    ledIndicator.classList.add('off');
                    connectionStatus.textContent = '🔴 offline';
                    liveText.textContent = 'offline';
                }
            }


 


// 🔔 Notifications Browser API Sound (Throttled Beep)

const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

let lastBeepTime = 0;          // timestamp of last sound
const BEEP_INTERVAL = 300;     // ms → max ~3 sounds/sec

function playChatBeepThrottled() {
  const now = Date.now();

  // 🚫 THROTTLE CHECK
  if (now - lastBeepTime < BEEP_INTERVAL) {
    return; // ignore extra messages
  }

  lastBeepTime = now;

  // ✅ Resume context if blocked by autoplay policy
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }

  // 🔊 Create sound
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();

  oscillator.type = "sine";
  oscillator.frequency.value = 900;

  gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + 0.12
  );

  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  oscillator.start();
  oscillator.stop(audioCtx.currentTime + 0.12);
}

// 👆 Required user interaction to unlock audio (autoplay policy)
document.addEventListener(
  "click",
  () => {
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  },
  { once: true }
);



            // handle incoming raw data
            function handleIncoming(raw) {
                console.log('[in]', raw);

                // system-like messages (join, left, info)
                if (raw.includes('joined') || raw.includes('left') || raw.includes('/name') || raw.includes('Welcome') || raw.includes('set to') || raw.includes('Unknown command') || raw.includes('* ')) {
                    // but keep PMs as cards, not system lines
                    if (raw.match(/PM from \S+:|\[PM from .*\]|private message from/i)) {
                        let from = 'someone';
                        let text = raw;
                        const pmMatch = raw.match(/PM from (\S+?):\s*(.*)/i);
                        if (pmMatch) {
                            from = pmMatch[1];
                            text = pmMatch[2];
                        }
playChatBeepThrottled();

                        addCard(text, from, 'standard', false, true); // incoming private
                        return;
                    }
                    addSystemLine(raw);
                    return;
                }

                // normal broadcast: <user> message
                const broadMatch = raw.match(/^<(\S+)>\s*(.*)/);
                if (broadMatch) {
                    const from = broadMatch[1];
                    const text = broadMatch[2];

playChatBeepThrottled();
                    addCard(text, from, 'standard', false, false);

                } else {

playChatBeepThrottled();
                    addCard(raw, 'broadcast', 'standard', false, false);
                }
            }







            // send command / message
            function sendMessage() {
                if (!socket || socket.readyState !== WebSocket.OPEN) {
                    addSystemLine('⚠️ not connected · refresh');
                    return;
                }

                const raw = inputField.value.trim();
                if (raw === '') return;

                // track own name on /name
                if (raw.startsWith('/name ')) {
                    const name = raw.substring(6).trim();
                    if (name.length > 0) {
                        currentUser = name;
                        userNameSpan.textContent = `👤 ${currentUser}`;
                    }
                }

                // show outgoing card (right)
                let isPrivate = false;
                if (raw.startsWith('/pm ')) {
                    isPrivate = true;
                }
                addCard(raw, currentUser || 'me', 'standard', true, isPrivate);

                // send to server
                socket.send(raw);
                inputField.value = '';
            }

            // connect websocket
            function connect() {
                try {
                    socket = new WebSocket(wsUrl);
                } catch (e) {
                    addSystemLine('❌ connection error');
                    setOnline(false);
                    return;
                }

                socket.onopen = () => {
                    setOnline(true);
                    addSystemLine('✅ connected · raise your log');
                };

                socket.onmessage = (ev) => handleIncoming(ev.data);
                socket.onerror = () => {
                    addSystemLine('⚠️ connection error');
                    setOnline(false);
                };
                socket.onclose = (e) => {
                    setOnline(false);
                    addSystemLine(`🔌 closed (${e.code}) · refresh`);
                    socket = null;
                };
            }

            connect();

            sendButton.addEventListener('click', sendMessage);
            inputField.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // periodic status check
            setInterval(() => {
                if (!socket || socket.readyState !== WebSocket.OPEN) {
                    setOnline(false);
                } else {
                    setOnline(true);
                }
            }, 700);
        })();
    </script>

<script>
(function() {
    const fabMain = document.getElementById('fabMain');
    const fabMenu = document.getElementById('fabMenu');
    const fabOverlay = document.getElementById('fabOverlay');
    let isOpen = false;

    function toggleMenu() {
        isOpen = !isOpen;
        
        if (isOpen) {
            fabMenu.classList.add('active');
            fabMain.classList.add('active');
            fabOverlay.classList.add('active');
            fabMain.querySelector('.fab-icon').textContent = '×';
            fabMain.setAttribute('aria-label', 'Close quick access menu');
        } else {
            fabMenu.classList.remove('active');
            fabMain.classList.remove('active');
            fabOverlay.classList.remove('active');
            fabMain.querySelector('.fab-icon').textContent = '+';
            fabMain.setAttribute('aria-label', 'Quick access menu');
        }
    }

    function closeMenu() {
        if (isOpen) {
            isOpen = false;
            fabMenu.classList.remove('active');
            fabMain.classList.remove('active');
            fabOverlay.classList.remove('active');
            fabMain.querySelector('.fab-icon').textContent = '+';
            fabMain.setAttribute('aria-label', 'Quick access menu');
        }
    }

    // Toggle on button click
    fabMain.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleMenu();
    });

    // Close on overlay click
    fabOverlay.addEventListener('click', closeMenu);

    // Close on pressing Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && isOpen) {
            closeMenu();
        }
    });

    // Close on scroll (optional — comment out if you want it to stay open)
    let scrollTimeout;
    window.addEventListener('scroll', function() {
        if (isOpen) {
            closeMenu();
        }
    }, { passive: true });

    console.log('✅ Floating Quick Access button ready');
})();
</script>
</body>
</html>
